<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Zaidi Tailors</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Sora:wght@400;500;600;700&display=swap');
:root{
  --primary:#1a1a2e;--accent:#e94560;--gold:#f5a623;--green:#00b894;
  --blue:#0984e3;--red:#d63031;--orange:#e17055;
  --surface:#fff;--surface2:#f8f9fa;--border:#e9ecef;
  --text:#1a1a2e;--text2:#636e72;
  --shadow:0 2px 12px rgba(0,0,0,.08);--radius:14px;--rsm:8px;
  --font:'Sora','Noto Sans Devanagari',sans-serif;--nh:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--surface2);color:var(--text);min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--primary);height:var(--nh);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.logo-en{font-size:17px;font-weight:700;color:#fff}
.logo-hi{font-size:11px;color:var(--gold);font-weight:500}
.topbar-r{display:flex;gap:8px;align-items:center}
.lang-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
.icon-btn2{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:var(--font)}
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex;height:60px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--text2);font-family:var(--font);padding:4px 0}
.nitem.active{color:var(--accent)}
.nicon{font-size:21px;line-height:1}
.nlabel{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pwrap{padding-top:calc(var(--nh)+24px);padding-bottom:76px;min-height:100vh}
.pinner{padding: 80px 12px 0;max-width:600px;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ptitle{font-size:20px;font-weight:700}
.ptitle .sub{font-size:11px;color:var(--text2);font-weight:400;display:block}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--rsm);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .18s;white-space:nowrap;text-decoration:none}
.btn-p{background:var(--accent);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-o{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:7px 12px;font-size:11px}
.btn-xs{padding:5px 9px;font-size:10px}
.fab{position:fixed;bottom:70px;right:16px;z-index:90;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(233,69,96,.45);cursor:pointer}
/* CARDS */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card-s{cursor:default}.card-s:hover{transform:none;box-shadow:var(--shadow)}
/* STATS */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.scard{border-radius:var(--radius);padding:16px 14px;color:#fff;position:relative;overflow:hidden}
.scard::after{content:'';position:absolute;right:-10px;top:-10px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1)}
.scard.gr{background:linear-gradient(135deg,#00b894,#00cec9)}
.scard.or{background:linear-gradient(135deg,#e17055,#fdcb6e)}
.scard.bl{background:linear-gradient(135deg,#0984e3,#74b9ff)}
.scard.rd{background:linear-gradient(135deg,#d63031,#e17055)}
.si{font-size:22px;margin-bottom:6px}
.sv{font-size:22px;font-weight:700;line-height:1}
.sl{font-size:10px;opacity:.85;margin-top:3px;font-weight:500}
/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.bdg-pend{background:#fff3cd;color:#856404}
.bdg-prog{background:#cfe2ff;color:#084298}
.bdg-rdy{background:#d1e7dd;color:#0f5132}
.bdg-deliv{background:#e2e3e5;color:#41464b}
.bdg-canc{background:#f8d7da;color:#842029}
/* ORDER CARD */
.och{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.oname{font-size:15px;font-weight:700}
.ophone{font-size:11px;color:var(--text2);margin-top:1px}
.ometa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--text2)}
.chip strong{color:var(--text)}
.oamt{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.ab{flex:1;text-align:center}
.ab .al{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.ab .av{font-size:14px;font-weight:700;margin-top:1px}
.av.red{color:var(--red)}.av.grn{color:var(--green)}
/* MULTI-ITEM ORDER */
.item-row{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:12px;margin-bottom:8px;position:relative}
.item-row-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.item-num{font-size:12px;font-weight:700;color:var(--accent)}
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add-item-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:var(--rsm);background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);font-family:var(--font);margin-bottom:8px;transition:all .18s}
.add-item-btn:hover{border-color:var(--accent);color:var(--accent)}
/* FORM */
.fsec{margin-bottom:18px}
.fstitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fg label{font-size:11px;font-weight:600;color:var(--text2)}
.fg label .hi{font-size:10px;color:var(--accent);margin-left:4px}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--border);border-radius:var(--rsm);padding:11px 13px;font-size:14px;font-family:var(--font);background:var(--surface);color:var(--text);width:100%;transition:border-color .2s;-webkit-appearance:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent)}
.fg textarea{resize:vertical;min-height:68px}
.factions{display:flex;gap:10px;margin-top:18px}
.factions .btn{flex:1;justify-content:center;padding:14px}
/* MODAL */
.moverlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.modal{background:var(--surface);width:100%;max-height:93vh;border-radius:20px 20px 0 0;overflow-y:auto;padding:20px 16px 32px;animation:sup .3s ease}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mtitle{font-size:18px;font-weight:700}
.mclose{width:34px;height:34px;border:none;background:var(--surface2);border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* SEARCHABLE DROPDOWN */
.sdwrap{position:relative;width:100%}
.sdinput{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--rsm);background:var(--surface);transition:border-color .2s;overflow:hidden}
.sdinput:focus-within{border-color:var(--accent)}
.sdinput input{border:none;outline:none;padding:11px 13px;font-size:14px;font-family:var(--font);flex:1;background:transparent;color:var(--text);min-width:0}
.sdbtn{padding:0 10px;background:none;border:none;font-size:13px;cursor:pointer;color:var(--text2);flex-shrink:0;height:100%}
.sdlist{position:absolute;top:calc(100%+3px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rsm);z-index:500;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sditem{padding:10px 13px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.sditem:last-child{border-bottom:none}
.sditem:hover,.sditem.sel{background:var(--surface2)}
.sdmain{font-weight:600;color:var(--text)}
.sdsub{font-size:11px;color:var(--text2);margin-top:1px}
.sdempty{padding:14px;font-size:13px;color:var(--text2);text-align:center}
/* SEARCH BAR */
.sbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 13px;margin-bottom:12px;transition:border-color .2s}
.sbar:focus-within{border-color:var(--accent)}
.sbar input{border:none;background:none;font-size:14px;flex:1;font-family:var(--font);outline:none;color:var(--text)}
.sbar button{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text2);flex-shrink:0;padding:0}
/* INV */
.ibar-w{background:var(--surface2);border-radius:4px;height:6px;margin:10px 0;overflow:hidden}
.ibar{height:100%;border-radius:4px;transition:width .5s}
.istats{display:flex;justify-content:space-between;font-size:12px}
/* CUSTOMERS */
.crow{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:none}
.cavatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--orange));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;margin-right:12px;cursor:pointer}
.cinfo{flex:1;min-width:0;cursor:pointer}
.cname{font-size:15px;font-weight:600}
.csub{font-size:11px;color:var(--text2);margin-top:2px}
.cacts{display:flex;gap:6px}
/* MEASUREMENTS */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{background:var(--surface2);border-radius:8px;padding:10px 12px}
.mlabel{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mlabel .hi{color:var(--accent);font-size:9px}
.mval{font-size:17px;font-weight:700;color:var(--text)}
.munit{font-size:9px;color:var(--text2)}
/* DETAIL */
.dhead{background:var(--primary);margin:0 -16px;padding:20px 20px 22px;margin-top:-20px;margin-bottom:18px}
.dname{font-size:22px;font-weight:700;color:#fff}
.dsub{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.dkey{font-size:12px;color:var(--text2)}
.dval{font-size:14px;font-weight:600}
/* REPORTS */
.rtabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.rtab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--font)}
.rtab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.rkpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.rkpi{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
.rkpi .rl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.rkpi .rv{font-size:20px;font-weight:700;margin-top:4px}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.blbl{width:68px;font-size:11px;color:var(--text2);flex-shrink:0}
.btrack{flex:1;background:var(--surface2);border-radius:4px;height:22px;overflow:hidden}
.bfill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#fff}
/* FILTER */
.frow{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.fchip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--font);flex-shrink:0}
.fchip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* MISC */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.25);animation:fdin .3s;white-space:nowrap}
@keyframes fdin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.empty{text-align:center;padding:44px 20px;color:var(--text2)}
.empty .ei{font-size:44px;margin-bottom:12px}
.empty .et{font-size:15px;font-weight:500}
.qgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.qcard{background:var(--surface);border-radius:var(--radius);padding:16px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow)}
.qcard .qi{font-size:28px}
.qcard .ql{font-size:10px;font-weight:600;color:var(--text2);margin-top:6px}
.alert{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--rsm);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:#856404}
.divider{height:1px;background:var(--border);margin:12px 0}
.tred{color:var(--red)}.tgrn{color:var(--green)}
.tag{display:inline-block;font-size:9px;padding:1px 7px;border-radius:8px;font-weight:700;margin-left:5px;vertical-align:middle}
.tag-auto{background:#d1e7dd;color:#0f5132}
.tag-man{background:#fff3cd;color:#856404}
.reset-lnk{font-size:10px;color:var(--orange);cursor:pointer;margin-top:3px;text-decoration:underline}
.ppills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.ppill{padding:9px 14px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);text-align:center}
.ppill .phi{font-size:10px;color:var(--text2);display:block}
.ppill.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.ppill.sel .phi{color:var(--gold)}
.spills{display:flex;gap:10px}
.spill{flex:1;padding:12px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;font-family:var(--font)}
.spill .spi{font-size:20px}
.spill .spt{font-size:12px;font-weight:600;display:block;margin-top:4px}
.spill .sps{font-size:10px;color:var(--text2);display:block}
.spill.sel{border-color:var(--accent);background:#fff0f3}
.cfg-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cfg-name{flex:1}
.cfg-name .en{font-size:14px;font-weight:600}
.cfg-name .hi{font-size:11px;color:var(--accent)}
.cfg-inp{width:90px;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:var(--font);text-align:center}
.vbtn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:11px 12px;cursor:pointer;font-size:18px;color:var(--text2);flex-shrink:0}
.vbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;animation:plse 1s infinite}
@keyframes plse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.4)}50%{box-shadow:0 0 0 8px rgba(233,69,96,0)}}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,useMemo}=React;
const e=React.createElement;

/* ── i18n ── */
const TR={
  en:{
    nav:{dashboard:'Dashboard',orders:'Orders',customers:'Customers',measurements:'Measurements',inventory:'Inventory'},

  },
  hi:{

/* ── SEARCHABLE DROPDOWN ── used in: cloth selector, customer selector */
function SDrop({value,onChange,items,placeholder,getLabel,getSub,filterFn}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);
  const ref=useRef();
  const sel=items.find(i=>i.id===value);

  useEffect(()=>{
    const h=ev=>{if(ref.current&&!ref.current.contains(ev.target)){setOpen(false);setQ('');}};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);

  const visible=q?items.filter(i=>filterFn?filterFn(i,q.toLowerCase()):hits(getLabel(i),q.toLowerCase())):items;

  return e('div',{className:'sdwrap',ref},
    e('div',{className:'sdinput'},
      e('input',{
        value: open ? q : (sel ? getLabel(sel) : ''),
        placeholder: sel ? getLabel(sel) : placeholder,
        onFocus:()=>{setOpen(true);setQ('');},
        onChange:ev=>{setQ(ev.target.value);setOpen(true);},
      }),
      sel && e('button',{className:'sdbtn',onMouseDown:ev=>{ev.preventDefault();onChange('');setQ('');}}, '✕'),
      e('button',{className:'sdbtn',onMouseDown:ev=>{ev.preventDefault();setOpen(o=>!o);}}, '▾'),
    ),
    open && e('div',{className:'sdlist'},
      visible.length===0
        ? e('div',{className:'sdempty'},'No results')
        : visible.map(i=>e('div',{key:i.id,className:`sditem ${value===i.id?'sel':''}`,
            onMouseDown:ev=>{ev.preventDefault();onChange(i.id);setQ('');setOpen(false);}},
            e('div',{className:'sdmain'},getLabel(i)),
            getSub && e('div',{className:'sdsub'},getSub(i)),
          ))
    )
  );
}

/* ── ORDER FORM (multi-item) ── */
const newItem=()=>({id:uid(),product:'Shirt',cloth_source:'shop',inventory_id:'',meters_used:1.8,stitching_price:500,material_cost:0,item_total:500,mat_manual:false});

function OrderForm({t,data,upd,toast2,onClose,editing,lang}){
  const [custName,setCustName]=useState(editing?.customer_name||'');
  const [custPhone,setCustPhone]=useState(editing?.customer_phone||'');
  const [delivDate,setDelivDate]=useState(editing?.delivery_date||'');
  const [advance,setAdvance]=useState(String(editing?.advance_paid||0));
  const [status,setStatus]=useState(editing?.status||'pending');
  const [notes,setNotes]=useState(editing?.notes||'');
  const [items,setItems]=useState(editing?.items?.length?editing.items:[newItem()]);
  const [listening,setListening]=useState(false);

  const invAvail=data.inventory.filter(i=>i.meters_available>0);

  /* Recalc each item's totals */
  const calcItem=(item,inventory)=>{
    let mat=parseFloat(item.material_cost||0);
    if(!item.mat_manual&&item.cloth_source==='shop'){
      const inv=inventory.find(i=>i.id===item.inventory_id);
      mat=parseFloat(((parseFloat(item.meters_used||0))*(inv?.sell_per_meter||0)).toFixed(2));
    }
    if(!item.mat_manual&&item.cloth_source==='customer') mat=0;
    const total=parseFloat((parseFloat(item.stitching_price||0)+mat).toFixed(2));
    return{...item,material_cost:item.mat_manual?item.material_cost:mat,item_total:total};
  };

  const updItem=(idx,patch)=>{
    setItems(prev=>{
      const next=[...prev];
      const merged={...next[idx],...patch};
      // If changing cloth source or inventory, reset manual flag
      if('cloth_source' in patch||'inventory_id' in patch||'meters_used' in patch) merged.mat_manual=false;
      next[idx]=calcItem(merged,data.inventory);
      return next;
    });
  };

  const addItem=()=>setItems(prev=>[...prev,newItem()]);
  const removeItem=idx=>setItems(prev=>prev.filter((_,i)=>i!==idx));

  const pickProduct=(idx,pname)=>{
    const conf=data.productConfig.find(x=>x.name===pname);
    updItem(idx,{product:pname,meters_used:conf?.meters||1.8,mat_manual:false});
  };

  const grandTotal=items.reduce((s,it)=>s+Number(it.item_total||0),0);
  const pending=parseFloat((grandTotal-parseFloat(advance||0)).toFixed(2));

  const startVoice=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Voice not supported');return;}
    const rec=new SR();rec.lang=lang==='hi'?'hi-IN':'en-IN';rec.interimResults=false;setListening(true);
    rec.onresult=ev=>{
      const txt=ev.results[0][0].transcript;setListening(false);
      const nm=txt.match(/(?:naam|name|नाम)[:\s]+([^\s,]+)/i);
      const ph=txt.match(/\d{10}/);
      if(nm)setCustName(nm[1]);
      if(ph)setCustPhone(ph[0]);
      toast2('🎙️ "'+txt+'"');
    };
    rec.onerror=()=>setListening(false);rec.onend=()=>setListening(false);rec.start();
  };

  const handleSave=()=>{
    if(!custName){toast2('Enter customer name');return;}
    if(!delivDate){toast2('Enter delivery date');return;}
    if(items.length===0){toast2('Add at least one item');return;}

    upd(prev=>{
      let newInv=[...prev.inventory];
      // Deduct inventory for new orders only
      if(!editing){
        items.forEach(item=>{
          if(item.cloth_source==='shop'&&item.inventory_id&&item.meters_used){
            newInv=newInv.map(i=>i.id===item.inventory_id
              ?{...i,meters_available:parseFloat((i.meters_available-parseFloat(item.meters_used)).toFixed(2))}
              :i);
          }
        });
      }
      const cust=prev.customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
      const newOrd={
        id:editing?editing.id:uid(),
        customer_id:cust?.id||'',
        customer_name:custName,
        customer_phone:custPhone,
        items,
        total_amount:grandTotal,
        advance_paid:parseFloat(advance||0),
        pending_amount:pending,
        delivery_date:delivDate,
        status,notes,
        created_at:editing?editing.created_at:tod(),
      };
      const newOrds=editing
        ?prev.orders.map(o=>o.id===editing.id?newOrd:o)
        :[...prev.orders,newOrd];
      return{...prev,inventory:newInv,orders:newOrds};
    });
    toast2(t('com.ok'));onClose();
  };

  return e('div',{className:'moverlay',onClick:onClose},
    e('div',{className:'modal',onClick:ev=>ev.stopPropagation()},
      e('div',{className:'mhead'},
        e('span',{className:'mtitle'},editing?'Edit Order':t('ord.new')),
        e('button',{className:'mclose',onClick:onClose},'✕'),
      ),

      /* Voice */
      e('div',{style:{display:'flex',gap:8,marginBottom:16,alignItems:'center'}},
        e('button',{className:`vbtn ${listening?'on':''}`,onClick:startVoice},'🎙️'),
        e('span',{style:{fontSize:11,color:'var(--text2)'}},listening?'Listening…':'Tap mic — Hindi/English'),
      ),

      /* Customer — searchable with phone+address shown */
      e('div',{className:'fsec'},
        e('div',{className:'fstitle'},'👤 Customer'),
        e('div',{className:'fg'},
          e('label',null,t('ord.name'),e('span',{className:'hi'},' ग्राहक का नाम')),
          e(SDrop,{
            value: data.customers.find(c=>c.name===custName&&c.phone===custPhone)?.id || data.customers.find(c=>c.name===custName)?.id || '',
            onChange: id=>{
              const c=data.customers.find(x=>x.id===id);
              if(c){setCustName(c.name);setCustPhone(c.phone||'');}
            },
            items: data.customers,
            placeholder:'Search name, phone, city…',
            getLabel: c=>c.name,
            getSub: c=>[c.phone,c.address].filter(Boolean).join(' · ')||'No details',
            filterFn:(c,q)=>[c.name,c.phone,c.address].some(v=>hits(v,q)),
          }),
          e('div',{style:{marginTop:6}},
            e('input',{placeholder:'Or type a new customer name…',value:custName,
              style:{border:'1.5px solid var(--border)',borderRadius:'var(--rsm)',padding:'10px 13px',fontSize:13,fontFamily:'var(--font)',width:'100%',color:'var(--text)'},
              onChange:ev=>setCustName(ev.target.value)}),
          ),
        ),
        e('div',{className:'fg'},
          e('label',null,t('ord.phone'),e('span',{className:'hi'},' फोन')),
          e('input',{type:'tel',value:custPhone,onChange:ev=>setCustPhone(ev.target.value),placeholder:'Auto-fills when customer selected'}),
        ),
      ),

      /* ── ITEMS (multi) ── */
      e('div',{className:'fsec'},
        e('div',{className:'fstitle'},'✂️ Items / आइटम'),
        ...items.map((item,idx)=>e(ItemBlock,{
          key:item.id,idx,item,t,
          data,invAvail,
          onUpdate:(patch)=>updItem(idx,patch),
          onRemove:items.length>1?()=>removeItem(idx):null,
          pickProduct:(p)=>pickProduct(idx,p),
        })),
        e('button',{className:'add-item-btn',onClick:addItem},'＋ '+t('ord.addItem')),
      ),

      /* Totals */
      e('div',{className:'fsec'},
        e('div',{className:'fstitle'},'💰 Payment / भुगतान'),
        e('div',{className:'fgrid'},
          e('div',{className:'fg'},
            e('label',null,'Grand Total / कुल रकम'),
            e('input',{value:fmt(grandTotal),readOnly:true,style:{background:'var(--surface2)',fontWeight:700,color:'var(--accent)'}}),
          ),
          e('div',{className:'fg'},
            e('label',null,t('ord.adv'),e('span',{className:'hi'},' अग्रिम')),
            e('input',{type:'number',min:0,value:advance,onChange:ev=>setAdvance(ev.target.value)}),
          ),
          e('div',{className:'fg'},
            e('label',null,t('ord.pend'),e('span',{className:'hi'},' बकाया')),
            e('input',{value:fmt(pending),readOnly:true,style:{background:'var(--surface2)',fontWeight:700,color:pending>0?'var(--red)':'var(--green)'}}),
          ),
          e('div',{className:'fg'},
            e('label',null,t('ord.del'),e('span',{className:'hi'},' डिलीवरी तारीख')),
            e('input',{type:'date',value:delivDate,onChange:ev=>setDelivDate(ev.target.value)}),
          ),
        ),
        e('div',{className:'fg'},
          e('label',null,t('ord.notes'),e('span',{className:'hi'},' नोट')),
          e('textarea',{value:notes,onChange:ev=>setNotes(ev.target.value),placeholder:'Special instructions…'}),
        ),
        editing&&e('div',{className:'fg'},
          e('label',null,t('ord.status')),
          e('select',{value:status,onChange:ev=>setStatus(ev.target.value)},
            ['pending','in_progress','ready','delivered','cancelled'].map(s=>e('option',{key:s,value:s},t('ord.st.'+s)))
          ),
        ),
      ),

      e('div',{className:'factions'},
        e('button',{className:'btn btn-p',onClick:handleSave},'💾 '+t('ord.save')),
        e('button',{className:'btn btn-o',onClick:onClose},t('com.cancel')),
      ),
    )
  );
}

/* ── INVENTORY PAGE ── */
function InvPage({t,data,upd,toast2}){
  const [search,setSearch]=useState('');
  const [showForm,setShowForm]=useState(false);
  const [editing,setEditing]=useState(null);
  const ef={brand:'',cloth_type:'',color:'',total_meters:'',meters_available:'',total_thaan_cost:'',markup_percentage:60,cost_per_meter:'',sell_per_meter:'',date_added:'',notes:'',image_url:'',image_name:''};
  const [form,setForm]=useState(ef);
  const ch=(k,v)=>setForm(f=>{
    const n={...f,[k]:v};
    // Auto cost_per_meter from thaan cost
    const tc=parseFloat(k==='total_thaan_cost'?v:n.total_thaan_cost)||0;
    const tm=parseFloat(k==='total_meters'?v:n.total_meters)||0;
    const mk=parseFloat(k==='markup_percentage'?v:n.markup_percentage)||0;
    if(tc&&tm){
      n.cost_per_meter=parseFloat((tc/tm).toFixed(2));
      n.sell_per_meter=parseFloat((n.cost_per_meter*(1+mk/100)).toFixed(2));
    } else if(k==='cost_per_meter') {
      n.sell_per_meter=parseFloat((parseFloat(v||0)*(1+mk/100)).toFixed(2));
    } else if(k==='markup_percentage'&&n.cost_per_meter) {
      n.sell_per_meter=parseFloat((parseFloat(n.cost_per_meter)*(1+parseFloat(v||0)/100)).toFixed(2));
    }
    return n;
  });

  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase();
    if(!q)return data.inventory;
    return data.inventory.filter(i=>[i.brand,i.cloth_type,i.color,i.id,i.notes].some(v=>hits(v,q)));
  },[data.inventory,search]);

  const openEdit=item=>{setForm({...item,date_added:item.date_added?.split('T')[0]||''});setEditing(item.id);setShowForm(true);};
  const del=id=>{if(!window.confirm(t('com.confirm')))return;upd(p=>({...p,inventory:p.inventory.filter(i=>i.id!==id)}));toast2('Deleted');};
  const saveFn=()=>{

  if(form.preview_url && !form.image_url){
    toast2('Wait for image upload');
    return;
  }

  if(!form.cloth_type||!form.total_meters){
    toast2('Fill cloth type & meters');
    return;
  }

  upd(prev=>{
    if(editing)
      return{
        ...prev,
        inventory:prev.inventory.map(i=>
          i.id===editing
            ? {...i,...form,id:editing}
            : i
        )
      };

    return{
      ...prev,
      inventory:[
        ...prev.inventory,
        {
          ...form,
          id:'I'+uid().slice(0,6).toUpperCase(),
          meters_available:form.meters_available||form.total_meters
        }
      ]
    };
  });

  toast2(t('com.ok'));

  setShowForm(false);

  setEditing(null);

  setForm(ef);
};

  return e('div',null,
    e('div',{className:'ph'},e('h2',{className:'ptitle'},t('inv.title'),e('span',{className:'sub'},filtered.length+' rolls'))),
    e(SBar,{value:search,onChange:setSearch,placeholder:t('inv.search')}),
    filtered.length===0&&e('div',{className:'empty'},e('div',{className:'ei'},'📦'),e('div',{className:'et'},t('com.nodata'))),
    filtered.map(item=>{
      const pct=item.total_meters>0?(item.meters_available/item.total_meters)*100:0;
      const low=item.meters_available<2;
      const linked=data.orders.filter(o=>(o.items||[]).some(i=>i.inventory_id===item.id)).length;
      return e('div',{key:item.id,className:'card card-s',style:{borderLeft:low?'3px solid var(--red)':'3px solid var(--green)'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
          e('div',null,

function RepPage({t,data}){
  const [tab,setTab]=useState('sales');

  const [to,setTo]=useState(tod());
  const filtered=data.orders.filter(o=>o.created_at>=from&&o.created_at<=to&&o.status!=='cancelled');
  const totalRev=filtered.reduce((s,o)=>s+Number(o.total_amount||0),0);
  const col=filtered.reduce((s,o)=>s+Number(o.advance_paid||0),0);
  const pend=filtered.reduce((s,o)=>s+Number(o.pending_amount||0),0);

  const byProd={};
  filtered.forEach(o=>(o.items||[]).forEach(i=>{byProd[i.product]=(byProd[i.product]||0)+Number(i.item_total||0);}));
  const prodE=Object.entries(byProd).sort((a,b)=>b[1]-a[1]);
  const maxP=prodE[0]?.[1]||1;

  const byCust={};
  data.orders.filter(o=>o.status!=='cancelled').forEach(o=>{
    const k=o.customer_name;if(!byCust[k])byCust[k]={n:0,s:0};byCust[k].n++;byCust[k].s+=Number(o.total_amount||0);
  });
  const topC=Object.entries(byCust).sort((a,b)=>b[1].s-a[1].s).slice(0,8);
  const colors=['#e94560','#0984e3','#00b894','#e17055','#6c5ce7','#fdcb6e','#00cec9','#fd79a8'];

  return e('div',null,
    e('div',{className:'ph'},e('h2',{className:'ptitle'},'📊 '+t('rep.title'))),
    e('div',{className:'rtabs'},['sales','inventory','customers'].map(tb=>e('button',{key:tb,className:`rtab ${tab===tb?'active':''}`,onClick:()=>setTab(tb)},t('rep.'+tb)))),
    drng,
    tab==='sales'&&e('div',null,
      e('div',{className:'rkpis'},
        e('div',{className:'rkpi'},e('div',{className:'rl'},t('rep.to')),e('div',{className:'rv'},filtered.length)),
        e('div',{className:'rkpi'},e('div',{className:'rl'},t('rep.tr')),e('div',{className:'rv',style:{color:'var(--accent)'}},fmt(totalRev))),
        e('div',{className:'rkpi'},e('div',{className:'rl'},t('rep.col')),e('div',{className:'rv',style:{color:'var(--green)'}},fmt(col))),
        e('div',{className:'rkpi'},e('div',{className:'rl'},t('rep.pend')),e('div',{className:'rv',style:{color:'var(--red)'}},fmt(pend))),
      ),
      e('div',{className:'card card-s'},
        e('div',{style:{fontWeight:700,marginBottom:12,fontSize:13}},t('rep.bp')),
        prodE.length===0&&e('p',{style:{color:'var(--text2)',fontSize:13}},t('com.nodata')),
        prodE.map(([p,v],i)=>e('div',{key:p,className:'brow'},
          e('div',{className:'blbl'},p),
          e('div',{className:'btrack'},e('div',{className:'bfill',style:{width:`${(v/maxP)*100}%`,background:colors[i%colors.length]}},fmt(v)))
        ))
      )
    ),
    tab==='inventory'&&data.inventory.map(item=>{
      const used=item.total_meters-item.meters_available;
      const pct=item.total_meters>0?(used/item.total_meters)*100:0;
      return e('div',{key:item.id,className:'card card-s',style:{marginBottom:10}},
        e('div',{style:{fontWeight:700,fontSize:14}},item.brand,' ',item.cloth_type,' — ',item.color),
        e('div',{className:'ibar-w',style:{margin:'8px 0'}},e('div',{className:'ibar',style:{width:`${pct}%`,background:'var(--orange)'}})),
        e('div',{className:'istats'},e('span',null,'Used: ',e('b',null,used,'m'),' / ',item.total_meters,'m'),e('span',null,'Stock value: ₹',((item.meters_available||0)*(item.sell_per_meter||0)).toLocaleString('en-IN'))),
      );
    }),
    tab==='customers'&&topC.map(([name,info],i)=>e('div',{key:name,className:'card card-s',style:{display:'flex',alignItems:'center',gap:12,marginBottom:8}},
      e('div',{style:{width:28,height:28,borderRadius:'50%',background:colors[i%colors.length],display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:13,flexShrink:0}},i+1),
      e('div',{style:{flex:1}},e('div',{style:{fontWeight:600,fontSize:14}},name),e('div',{style:{fontSize:11,color:'var(--text2)'}},info.n+' '+t('rep.ords'))),
      e('div',{style:{fontWeight:700,color:'var(--accent)'}},fmt(info.s)),
    ))
  );
}

/* ── SETTINGS PAGE ── */
function SetPage({t,data,upd,toast2}){
  const [config,setConfig]=useState(data.productConfig.map(p=>({...p})));
  const saveFn=()=>{upd(p=>({...p,productConfig:config}));toast2(t('com.ok'));};
  return e('div',null,
    e('div',{className:'ph'},e('h2',{className:'ptitle'},'⚙️ '+t('set.title'))),
    e('div',{className:'card card-s'},
      e('div',{style:{fontWeight:700,fontSize:13,marginBottom:4}},t('set.pc')),
      e('div',{style:{fontSize:11,color:'var(--text2)',marginBottom:14}},'Default meters per product. Applies to new orders only.'),
      config.map((p,i)=>e('div',{key:p.id,className:'cfg-row'},
        e('div',{className:'cfg-name'},e('div',{className:'en'},p.name),e('div',{className:'hi'},p.nameHi)),
        e('input',{className:'cfg-inp',type:'number',step:0.1,min:0,value:p.meters,onChange:ev=>setConfig(c=>c.map((x,j)=>j===i?{...x,meters:parseFloat(ev.target.value)}:x))}),
        e('span',{style:{fontSize:12,color:'var(--text2)'}},'m'),
      )),
      e('div',{className:'factions'},e('button',{className:'btn btn-p',onClick:saveFn},'💾 '+t('set.saveAll'))),
    ),
    e('div',{className:'card card-s',style:{marginTop:10}},
      e('div',{style:{fontWeight:700,fontSize:13,marginBottom:12}},'📊 Data Summary'),
      [['Orders',data.orders.length],['Customers',data.customers.length],['Inventory Rolls',data.inventory.length],['Measurements',data.measurements.length]]
        .map(([k,v])=>e('div',{key:k,style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:13}},
          e('span',{style:{color:'var(--text2)'}},k),e('span',{style:{fontWeight:700}},v)
        )),
      e('button',{
  className:'btn btn-g',
  style:{marginTop:14,width:'100%',justifyContent:'center'},
  onClick:async()=>{
  try{
    const payload = {
      customers:data.customers || [],
      inventory:data.inventory || [],
      measurements:data.measurements || [],
      orders:data.orders || [],
      productConfig:data.productConfig || []
    };

    const r = await fetch(API_URL,{
      method:'POST',
      body:JSON.stringify({
        action:'syncAll',
        payload
      })
    });

    const res = await r.json();

    console.log(res);

    toast2('☁ Sync Complete');

  }catch(err){

    console.error(err);

    toast2('Sync Failed');}}},'☁ Sync Backup'),
      e('button',{className:'btn btn-o',style:{marginTop:14,width:'100%',justifyContent:'center',color:'var(--red)'},
        onClick:()=>{if(window.confirm('Reset ALL data? Cannot be undone!')){localStorage.removeItem(KEY);window.location.reload();}}},'🗑️ Reset All Data'),
    ),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
