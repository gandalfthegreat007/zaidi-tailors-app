<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Zaidi Tailors — ज़ैदी टेलर्स</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Sora:wght@300;400;500;600;700&display=swap');
  :root{--primary:#1a1a2e;--accent:#e94560;--gold:#f5a623;--green:#00b894;--blue:#0984e3;--red:#d63031;--orange:#e17055;--surface:#fff;--surface2:#f8f9fa;--border:#e9ecef;--text:#1a1a2e;--text2:#636e72;--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:14px;--radius-sm:8px;--font:'Sora','Noto Sans Devanagari',sans-serif;--nav-h:64px}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:var(--surface2);color:var(--text);min-height:100vh;overflow-x:hidden}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--primary);height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 2px 20px rgba(0,0,0,.3)}
  .topbar-logo{display:flex;flex-direction:column}
  .topbar-logo .en{font-size:17px;font-weight:700;color:#fff;letter-spacing:.3px}
  .topbar-logo .hi{font-size:11px;color:var(--gold);font-weight:500}
  .topbar-right{display:flex;align-items:center;gap:10px}
  .lang-toggle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font)}
  .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex;height:60px;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--text2);font-family:var(--font);padding:6px 2px 2px}
  .nav-item.active{color:var(--accent)}
  .nav-icon{font-size:22px;line-height:1}
  .nav-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .page-wrap{padding-top:calc(var(--nav-h) + 12px);padding-bottom:80px;min-height:100vh}
  .page-inner{padding:0 12px;max-width:600px;margin:0 auto}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .section-title{font-size:20px;font-weight:700;color:var(--text)}
  .section-title .sub{font-size:11px;color:var(--text2);font-weight:400;display:block}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .18s;white-space:nowrap}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#c73652;transform:translateY(-1px)}
  .btn-green{background:var(--green);color:#fff}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-sm{padding:7px 12px;font-size:11px}
  .fab{position:fixed;bottom:76px;right:16px;z-index:90;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(233,69,96,.45);cursor:pointer;transition:all .2s}
  .fab:hover{transform:scale(1.08)}
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all .18s}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
  .card-flat{cursor:default}.card-flat:hover{transform:none;box-shadow:var(--shadow)}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-card{border-radius:var(--radius);padding:16px 14px;color:#fff;position:relative;overflow:hidden}
  .stat-card::after{content:'';position:absolute;right:-10px;top:-10px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.1)}
  .stat-card.green{background:linear-gradient(135deg,#00b894,#00cec9)}
  .stat-card.orange{background:linear-gradient(135deg,#e17055,#fdcb6e)}
  .stat-card.blue{background:linear-gradient(135deg,#0984e3,#74b9ff)}
  .stat-card.red{background:linear-gradient(135deg,#d63031,#e17055)}
  .stat-icon{font-size:22px;margin-bottom:6px}
  .stat-value{font-size:22px;font-weight:700;line-height:1}
  .stat-label{font-size:10px;opacity:.85;margin-top:3px;font-weight:500}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-pending{background:#fff3cd;color:#856404}
  .badge-progress{background:#cfe2ff;color:#084298}
  .badge-ready{background:#d1e7dd;color:#0f5132}
  .badge-delivered{background:#e2e3e5;color:#41464b}
  .badge-cancelled{background:#f8d7da;color:#842029}
  .order-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
  .order-name{font-size:16px;font-weight:700}
  .order-phone{font-size:11px;color:var(--text2);margin-top:1px}
  .order-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .meta-chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text2)}
  .meta-chip strong{color:var(--text)}
  .order-amounts{display:flex;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
  .amount-block{flex:1;text-align:center}
  .amount-block .label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
  .amount-block .value{font-size:15px;font-weight:700;color:var(--text);margin-top:1px}
  .amount-block .value.red{color:var(--red)}
  .amount-block .value.green{color:var(--green)}
  .form-section{margin-bottom:20px}
  .form-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .form-group.full{grid-column:1/-1}
  .form-group label{font-size:11px;font-weight:600;color:var(--text2)}
  .form-group label .hi{font-size:10px;color:var(--accent);margin-left:4px}
  .form-group input,.form-group select,.form-group textarea{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;font-family:var(--font);background:var(--surface);color:var(--text);width:100%;transition:border-color .2s;-webkit-appearance:none}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
  .form-group textarea{resize:vertical;min-height:72px}
  .form-actions{display:flex;gap:10px;margin-top:20px}
  .form-actions .btn{flex:1;justify-content:center;padding:14px}
  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
  .modal{background:var(--surface);width:100%;max-height:92vh;border-radius:20px 20px 0 0;overflow-y:auto;padding:20px 16px 32px;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .modal-title{font-size:18px;font-weight:700}
  .modal-close{width:34px;height:34px;border:none;background:var(--surface2);border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  /* ── SEARCHABLE DROPDOWN ── */
  .sdrop-wrap{position:relative;width:100%}
  .sdrop-input-row{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;transition:border-color .2s}
  .sdrop-input-row:focus-within{border-color:var(--accent)}
  .sdrop-input-row input{border:none;outline:none;padding:12px 14px;font-size:14px;font-family:var(--font);flex:1;background:transparent;color:var(--text)}
  .sdrop-arrow{padding:0 12px;background:none;border:none;font-size:13px;cursor:pointer;color:var(--text2);flex-shrink:0}
  .sdrop-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);z-index:300;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
  .sdrop-item{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
  .sdrop-item:last-child{border-bottom:none}
  .sdrop-item:hover,.sdrop-item.hi{background:var(--surface2)}
  .sdrop-main{font-weight:600;color:var(--text)}
  .sdrop-sub{font-size:11px;color:var(--text2);margin-top:1px}
  .sdrop-empty{padding:14px;font-size:13px;color:var(--text2);text-align:center}
  /* ── SEARCH BAR ── */
  .search-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px}
  .search-bar:focus-within{border-color:var(--accent)}
  .search-bar input{border:none;background:none;font-size:14px;flex:1;font-family:var(--font);outline:none;color:var(--text)}
  .search-clear{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text2);flex-shrink:0;padding:0}
  /* ── INVENTORY ── */
  .inv-bar-wrap{background:var(--surface2);border-radius:4px;height:6px;margin:10px 0;overflow:hidden}
  .inv-bar{height:100%;border-radius:4px;transition:width .5s ease}
  .inv-stats{display:flex;justify-content:space-between;font-size:12px}
  .inv-brand{font-size:12px;color:var(--text2);margin-top:2px}
  /* ── CUSTOMERS ── */
  .customer-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
  .customer-row:last-child{border-bottom:none}
  .customer-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--orange));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;margin-right:12px;cursor:pointer}
  .customer-info{flex:1;min-width:0;cursor:pointer}
  .customer-name{font-size:15px;font-weight:600}
  .customer-sub{font-size:11px;color:var(--text2);margin-top:2px}
  .customer-actions{display:flex;gap:6px}
  /* ── MEASUREMENTS ── */
  .meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .meas-item{background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .meas-label{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .meas-label .hi{color:var(--accent);font-size:9px}
  .meas-value{font-size:17px;font-weight:700;color:var(--text)}
  .meas-unit{font-size:9px;color:var(--text2)}
  /* ── REPORTS ── */
  .report-tab-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
  .report-tab{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--font);transition:all .18s}
  .report-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .report-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .report-kpi{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
  .report-kpi .label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
  .report-kpi .value{font-size:20px;font-weight:700;margin-top:4px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar-label{width:70px;font-size:11px;color:var(--text2);flex-shrink:0}
  .bar-track{flex:1;background:var(--surface2);border-radius:4px;height:22px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#fff;transition:width .6s ease}
  /* ── FILTER ── */
  .filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
  .filter-chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--font);flex-shrink:0;transition:all .18s}
  .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* ── TOAST ── */
  .toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,.25);animation:fadeD .3s ease;white-space:nowrap}
  @keyframes fadeD{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  /* ── VOICE ── */
  .voice-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:11px 12px;cursor:pointer;font-size:18px;color:var(--text2);flex-shrink:0}
  .voice-btn.listening{background:var(--accent);border-color:var(--accent);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.4)}50%{box-shadow:0 0 0 8px rgba(233,69,96,0)}}
  /* ── PRODUCT PILLS ── */
  .product-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .product-pill{padding:10px 16px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);transition:all .18s;text-align:center}
  .product-pill .hi{font-size:10px;color:var(--text2);display:block}
  .product-pill.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
  .product-pill.selected .hi{color:var(--gold)}
  /* ── SOURCE PILLS ── */
  .source-pills{display:flex;gap:10px}
  .source-pill{flex:1;padding:12px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;font-family:var(--font);transition:all .18s}
  .source-pill .icon{font-size:20px}
  .source-pill .text{font-size:12px;font-weight:600;display:block;margin-top:4px}
  .source-pill .sub{font-size:10px;color:var(--text2);display:block}
  .source-pill.selected{border-color:var(--accent);background:#fff0f3}
  /* ── MISC ── */
  .empty{text-align:center;padding:48px 20px;color:var(--text2)}
  .empty .icon{font-size:48px;margin-bottom:12px}
  .empty .text{font-size:15px;font-weight:500}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
  .quick-card{background:var(--surface);border-radius:var(--radius);padding:16px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);box-shadow:var(--shadow);transition:all .18s}
  .quick-card:hover{transform:translateY(-2px)}
  .quick-card .q-icon{font-size:28px}
  .quick-card .q-label{font-size:10px;font-weight:600;color:var(--text2);margin-top:6px}
  .alert-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .alert-banner .icon{font-size:20px;flex-shrink:0}
  .alert-banner .text{font-size:12px;font-weight:600;color:#856404}
  .detail-header{background:var(--primary);margin:0 -16px;padding:20px 20px 24px;margin-top:-20px;margin-bottom:20px}
  .detail-name{font-size:22px;font-weight:700;color:#fff}
  .detail-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}
  .detail-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
  .detail-row:last-child{border-bottom:none}
  .detail-key{font-size:12px;color:var(--text2)}
  .detail-val{font-size:14px;font-weight:600}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .text-red{color:var(--red)}.text-green{color:var(--green)}
  .config-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
  .config-name{flex:1}
  .config-name .en{font-size:14px;font-weight:600}
  .config-name .hi{font-size:11px;color:var(--accent)}
  .config-input{width:90px;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:var(--font);text-align:center}
  .tag-auto{display:inline-block;font-size:9px;padding:1px 7px;border-radius:8px;font-weight:700;margin-left:5px;background:#d1e7dd;color:#0f5132;vertical-align:middle}
  .tag-manual{display:inline-block;font-size:9px;padding:1px 7px;border-radius:8px;font-weight:700;margin-left:5px;background:#fff3cd;color:#856404;vertical-align:middle}
  .reset-link{font-size:10px;color:var(--orange);cursor:pointer;margin-top:3px;text-decoration:underline;display:inline-block}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,useMemo}=React;

// ── i18n ──────────────────────────────────────────────────────────────────────
const TR={

function SearchDrop({value,onChange,items,placeholder,renderLabel,renderSub,filterFn}){
  const [q,setQ]=useState('');
  const [open,setOpen]=useState(false);

  const sel=items.find(i=>i.id===value);

  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setQ('');}};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
  },[]);

  const visible=q?items.filter(i=>filterFn?filterFn(i,q):hits(renderLabel(i),q)):items;

  return React.createElement('div',{className:'sdrop-wrap',ref},
    React.createElement('div',{className:'sdrop-input-row'},
      React.createElement('input',{
        value:open?q:(sel?renderLabel(sel):''),

        onFocus:()=>{setOpen(true);setQ('');},
        onChange:e=>{setQ(e.target.value);setOpen(true);},
